<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">
    <header class="fade-in">
      <div class="logo-mark">S</div>
      <h1>Skill Analyzer</h1>
      <p class="subtitle">Analyze git commits to discover developer skills</p>
    </header>

    <!-- Settings Panel -->
    <section class="card card-settings fade-in" id="step-settings" style="animation-delay:0.1s">
      <div class="card-header clickable" onclick="toggleSettings()">
        <div class="card-header-left">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <span class="card-title">Settings</span>
        </div>
        <svg class="chevron" id="settings-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div id="settings-body" class="settings-body">
        <div class="field-row">
          <div class="field" style="flex:1">
            <label for="provider-select">Provider</label>
            <select id="provider-select" onchange="onProviderChange()">
              <option value="anthropic">Anthropic</option>
              <option value="openai">OpenAI</option>
            </select>
          </div>
          <div class="field" style="flex:2">
            <label for="model-select">Model</label>
            <select id="model-select"></select>
          </div>
        </div>
        <div class="field">
          <label for="api-key-input">API Key</label>
          <div class="input-row">
            <input type="password" id="api-key-input" placeholder="sk-...">
            <button onclick="toggleKeyVisibility()" id="btn-toggle-key" class="btn-ghost">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="hint">Stored in browser memory only. Never persisted.</span>
        </div>
      </div>
    </section>

    <!-- Step 1: Repo -->
    <section class="card fade-in" id="step-repo" style="animation-delay:0.2s">
      <div class="card-header">
        <div class="card-header-left">
          <span class="step-pill">1</span>
          <span class="card-title">Repository</span>
        </div>
      </div>
      <div class="card-body">
        <label for="repo-path">Path to git repository</label>
        <div class="input-row">
          <input type="text" id="repo-path" placeholder="/path/to/your/repo">
          <button id="btn-load-repo" class="btn-primary" onclick="loadRepo()">
            <span class="btn-label">Load</span>
            <svg class="btn-spinner hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Step 2: Filter -->
    <section class="card" id="step-filter">
      <div class="card-header">
        <div class="card-header-left">
          <span class="step-pill">2</span>
          <span class="card-title">Filter Commits</span>
        </div>
        <span class="commit-count" id="commit-count"></span>
      </div>
      <div class="card-body">
        <div class="filter-bar">
          <div class="filter-group">
            <label for="filter-branch">Branch</label>
            <select id="filter-branch" onchange="applyFilters()">
              <option value="">All branches</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="filter-author">Author</label>
            <select id="filter-author" onchange="applyFilters()">
              <option value="">All authors</option>
            </select>
          </div>
        </div>
        <div id="commit-info" class="commit-info"></div>
      </div>
    </section>

    <!-- Step 3: Analyze -->
    <section class="card" id="step-analyze">
      <div class="card-header">
        <div class="card-header-left">
          <span class="step-pill">3</span>
          <span class="card-title">Analyze</span>
        </div>
      </div>
      <div class="card-body">
        <label for="existing-skills">Existing skills.md <span class="label-hint">(optional)</span></label>
        <textarea id="existing-skills" rows="4" placeholder="Paste existing content to update, or leave empty..."></textarea>
        <button id="btn-analyze" class="btn-primary btn-full" onclick="runAnalysis()">
          <span class="btn-label">Analyze Commits</span>
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
      </div>
    </section>

    <!-- Step 4: Results -->
    <section class="card" id="step-results">
      <div class="card-header">
        <div class="card-header-left">
          <span class="step-pill">4</span>
          <span class="card-title">Results</span>
        </div>
      </div>
      <div class="card-body">
        <div id="progress-area" class="progress-area">
          <div class="progress-track">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <p id="progress-text" class="progress-text">Starting...</p>
        </div>
        <div id="result-area" class="result-area">
          <div class="result-actions">
            <button class="btn-ghost" onclick="copyResult()" id="btn-copy">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copy</span>
            </button>
            <button class="btn-ghost" onclick="downloadResult()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span>Download</span>
            </button>
          </div>
          <div id="skills-output" class="skills-output"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
