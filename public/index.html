<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Skill Analyzer</h1>
      <p class="subtitle">Analyze git commits to discover developer skills</p>
    </header>

    <!-- Settings Panel (collapsible) -->
    <section class="card" id="step-settings">
      <div class="step-header clickable" onclick="toggleSettings()">
        <span class="step-icon">&#9881;</span>
        <h2>Settings</h2>
        <span class="toggle-arrow" id="settings-arrow">&#9660;</span>
      </div>
      <div id="settings-body" class="settings-body">
        <div class="field-row">
          <div class="field" style="flex:1">
            <label for="provider-select">Provider</label>
            <select id="provider-select" onchange="onProviderChange()">
              <option value="anthropic">Anthropic</option>
              <option value="openai">OpenAI</option>
            </select>
          </div>
          <div class="field" style="flex:2">
            <label for="model-select">Model</label>
            <select id="model-select"></select>
          </div>
        </div>
        <div class="field">
          <label for="api-key-input">API Key</label>
          <div class="input-row">
            <input type="password" id="api-key-input" placeholder="sk-...">
            <button onclick="toggleKeyVisibility()" id="btn-toggle-key" class="small-btn">Show</button>
          </div>
          <span class="hint">Stored in browser memory only, never sent to our server.</span>
        </div>
      </div>
    </section>

    <!-- Step 1: Repo Path -->
    <section class="card" id="step-repo">
      <div class="step-header">
        <span class="step-number">1</span>
        <h2>Repository</h2>
      </div>
      <div class="field">
        <label for="repo-path">Path to git repository</label>
        <div class="input-row">
          <input type="text" id="repo-path" placeholder="/path/to/your/repo">
          <button id="btn-load-repo" onclick="loadRepo()">Load</button>
        </div>
      </div>
    </section>

    <!-- Step 2: Filter Commits -->
    <section class="card hidden" id="step-filter">
      <div class="step-header">
        <span class="step-number">2</span>
        <h2>Filter Commits</h2>
      </div>
      <div class="filter-bar">
        <div class="filter-group">
          <label for="filter-branch">Branch</label>
          <select id="filter-branch" onchange="applyFilters()">
            <option value="">All branches</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-author">Author</label>
          <select id="filter-author" onchange="applyFilters()">
            <option value="">All authors</option>
          </select>
        </div>
      </div>
      <div id="commit-info" class="commit-info hidden"></div>
    </section>

    <!-- Step 3: Analyze -->
    <section class="card hidden" id="step-analyze">
      <div class="step-header">
        <span class="step-number">3</span>
        <h2>Analyze</h2>
      </div>
      <div class="field">
        <label for="existing-skills">Existing skills.md (optional — paste content to update)</label>
        <textarea id="existing-skills" rows="6" placeholder="Paste your existing skills.md content here, or leave empty to generate from scratch..."></textarea>
      </div>
      <button id="btn-analyze" class="primary" onclick="runAnalysis()">Analyze Commits</button>
    </section>

    <!-- Step 4: Progress + Results -->
    <section class="card hidden" id="step-results">
      <div class="step-header">
        <span class="step-number">4</span>
        <h2>Results</h2>
      </div>
      <div id="progress-area" class="progress-area">
        <div class="progress-bar-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p id="progress-text" class="progress-text">Starting...</p>
      </div>
      <div id="result-area" class="hidden">
        <div class="result-actions">
          <button onclick="copyResult()">Copy to Clipboard</button>
          <button onclick="downloadResult()">Download skills.md</button>
        </div>
        <div id="skills-output" class="skills-output"></div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
